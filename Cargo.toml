[workspace]
resolver = "3"
members = ["crates/gust-core", "crates/gust-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tuna/gust"
authors = ["Tuna"]

[workspace.dependencies]
gust-core = { path = "crates/gust-core" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
hdrhistogram = "7"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Optimize release builds for a load generator: the tool must not be the bottleneck.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
